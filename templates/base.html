<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kids Haven{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Your Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/static/images/logo.png" alt="Logo" height="40" class="d-inline-block align-text-top me-2">
                Kids Haven
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="background-color: white;"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admissions">Admissions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/gallery">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
                    
                    <!-- NEW LOGIN AND REGISTER LINKS -->
                    <li class="nav-item ms-lg-3"><a class="nav-link" href="/auth/login" style="color: #f39c12 !important; font-weight: bold;">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="/auth/register" style="color: #f39c12 !important; font-weight: bold;">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    {% block content %}
    {% endblock %}

    <!-- Footer -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-0">© <span id="currentYear"></span> Kids Haven Nursery and Basic Schools Nibo. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Back to Top Button -->
    <button id="backToTopBtn" class="btn btn-warning" style="display:none; position:fixed; bottom:20px; right:20px; z-index:1000; border-radius: 50%; padding: 10px 15px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
        ↑
    </button>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- YOUR CUSTOM JS -->
    <script src="/static/js/main.js"></script>
</body>
</html>
